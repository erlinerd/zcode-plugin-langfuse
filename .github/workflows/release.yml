name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run package:plugin
      - name: Package the marketplace ZIP
        run: |
          version=$(node -p "require('./.zcode-plugin/plugin.json').version")
          (cd dist && zip -r -X "../zcode-plugin-langfuse-v${version}.zip" marketplace.json plugins)
          shasum -a 256 "zcode-plugin-langfuse-v${version}.zip" > "zcode-plugin-langfuse-v${version}.zip.sha256"
          shasum -a 256 -c "zcode-plugin-langfuse-v${version}.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./.zcode-plugin/plugin.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "zcode-plugin-langfuse-v${version}.zip" \
            "zcode-plugin-langfuse-v${version}.zip.sha256" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
